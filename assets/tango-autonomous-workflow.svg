<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1320" viewBox="0 0 2048 1320" role="img" aria-labelledby="title description">
<title id="title">TANGO 0.4.0 autonomous workflow</title>
<desc id="description">A task owner submits a goal and acceptance criteria to TANGO. The autonomous runner dispatches a real Codex executor. Recoverable failure or no progress returns to the runner. A fresh independent verifier checks candidate artifacts; failed checks return for repair, and satisfied original criteria complete the task. While the goal remains open, each ten substantive calculations trigger source inventory, five distinct participants across ten rounds, and a next direction. Persistent state and an explicitly configured user service support recovery. Pause, stop, and unresolved prerequisites gate continued work. Full real-model meeting and OS-service restart acceptance remain pending.</desc>
<defs>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#237F8B"/></marker>
<marker id="arrow-start" markerWidth="11" markerHeight="11" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#237F8B"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif"><rect width="2048" height="1320" fill="white"/><rect width="2048" height="9" fill="#237F8B"/><text x="80" y="77" text-anchor="start" fill="#1B3548" font-size="50" font-weight="700">TANGO</text><text x="80" y="119" text-anchor="start" fill="#526977" font-size="25" font-weight="400">Submit once. Execute, verify, recover, and continue toward the original goal.</text><text x="1920" y="60" text-anchor="end" fill="#237F8B" font-size="16" font-weight="700" letter-spacing="1.3">AUTONOMOUS WORKFLOW</text><text x="1920" y="88" text-anchor="end" fill="#526977" font-size="18" font-weight="400">VERSION 0.4.0</text><rect x="80" y="175" width="340" height="112" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="250.0" y="214" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Task owner</text><text x="250.0" y="245" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Original goal · criteria</text><text x="250.0" y="270" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Source material · controls</text><rect x="650" y="175" width="440" height="112" rx="14" fill="#E8F4F0" stroke="#BFCFD7" stroke-width="2"/><text x="870.0" y="214" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Autonomous runner</text><text x="870.0" y="245" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Queue · dispatch · continuation</text><text x="870.0" y="270" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">TANGO broker + local Codex CLI</text><rect x="1440" y="175" width="480" height="112" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="1680.0" y="214" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">User service</text><text x="1680.0" y="245" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">systemd / launchd</text><text x="1680.0" y="270" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Restart the runner after failure</text><path d="M 427,211 L 641,211" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="438.5" y="183" width="193.0" height="23" fill="white"/><text x="535" y="199" text-anchor="middle" fill="#526977" font-size="17" font-weight="400">goal · criteria · controls</text><path d="M 641,263 L 427,263" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="469.5" y="238" width="131.0" height="23" fill="white"/><text x="535" y="254" text-anchor="middle" fill="#526977" font-size="17" font-weight="400">status · results</text><path d="M 1432,211 L 1099,211" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="1206.5" y="182" width="119.0" height="24" fill="white"/><text x="1266" y="199" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">start / restart</text><path d="M 1099,263 L 1432,263" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="1171.0" y="237" width="190.0" height="24" fill="white"/><text x="1266" y="254" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">heartbeat / exit status</text><rect x="80" y="420" width="500" height="148" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="330.0" y="462" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Codex executor</text><text x="330.0" y="498" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Bounded substantive attempt</text><text x="330.0" y="526" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Artifacts · saved checkpoints</text><rect x="800" y="420" width="500" height="148" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="1050.0" y="462" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Independent verifier</text><text x="1050.0" y="498" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Fresh session · original criteria</text><text x="1050.0" y="526" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Check actual artifacts and sources</text><rect x="1530" y="420" width="390" height="148" rx="14" fill="#1B3548" stroke="#1B3548" stroke-width="2"/><text x="1725.0" y="462" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">Completed</text><text x="1725.0" y="498" text-anchor="middle" fill="#DCE7EC" font-size="20" font-weight="400">Original goal verified</text><text x="1725.0" y="526" text-anchor="middle" fill="#DCE7EC" font-size="20" font-weight="400">Outputs and evidence retained</text><path d="M 780,295 L 780,325 L 330,325 L 330,411" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="343.0" y="332" width="124.0" height="25" fill="white"/><text x="405" y="350" text-anchor="middle" fill="#526977" font-size="19" font-weight="400">next attempt</text><path d="M 530,411 L 530,370 L 900,370 L 900,295" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="577.0" y="342" width="276.0" height="24" fill="white"/><text x="715" y="359" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">recoverable failure / no progress</text><path d="M 1000,411 L 1000,295" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1020" y="350" text-anchor="start" fill="#526977" font-size="18" font-weight="400">failed check</text><text x="1020" y="375" text-anchor="start" fill="#526977" font-size="18" font-weight="400">repair / replan</text><path d="M 589,494 L 791,494" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="608.0" y="462" width="164.0" height="24" fill="white"/><text x="690" y="479" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">candidate artifacts</text><path d="M 1309,494 L 1521,494" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1346.0" y="462" width="138.0" height="24" fill="white"/><text x="1415" y="479" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">all criteria pass</text><text x="80" y="645" text-anchor="start" fill="#237F8B" font-size="20" font-weight="700">PERSISTENCE &amp; RECOVERY</text><rect x="80" y="667" width="500" height="150" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="330.0" y="709" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Persistent project state</text><text x="330.0" y="745" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Goals · criteria · checkpoints</text><text x="330.0" y="773" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Artifacts · journals · verdicts</text><path d="M 480,577 L 480,658" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="494.5" y="606" width="131.0" height="24" fill="white"/><text x="560" y="623" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">save / resume</text><rect x="800" y="667" width="500" height="150" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="1050.0" y="709" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Recovery</text><text x="1050.0" y="745" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Reconcile old processes first</text><text x="1050.0" y="773" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Resume from saved checkpoints</text><path d="M 800,742 L 589,742" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow-start)" stroke-dasharray="8 7"/><rect x="639.0" y="711" width="110.0" height="24" fill="white"/><text x="694" y="728" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">saved state</text><path d="M 1929,230 L 1960,230 L 1960,612 L 1050,612 L 1050,658" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="1313.5" y="584" width="253.0" height="24" fill="white"/><text x="1440" y="601" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">restart / reconcile before retry</text><text x="1510" y="645" text-anchor="start" fill="#237F8B" font-size="20" font-weight="700">CONTROL GATES · AT ANY STAGE</text><rect x="1510" y="667" width="410" height="150" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="1715" y="705" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Pause · stop · wait</text><text x="1715" y="739" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">Waiting: new information + recheck</text><text x="1715" y="769" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">Paused: explicit resume</text><text x="1715" y="799" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">Stopped: explicitly submit a new task</text><text x="80" y="906" text-anchor="start" fill="#237F8B" font-size="21" font-weight="700">GOAL STILL OPEN · AFTER EVERY 10 SUBSTANTIVE CALCULATIONS</text><rect x="80" y="953" width="470" height="190" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="315.0" y="995" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Source inventory</text><text x="315.0" y="1031" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Declared sources + accumulated work</text><text x="315.0" y="1059" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Classify · deduplicate · hash</text><text x="315.0" y="1087" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Seal summary and coverage limits</text><rect x="680" y="953" width="620" height="190" rx="14" fill="#E8F4F0" stroke="#BFCFD7" stroke-width="2"/><text x="990" y="995" text-anchor="middle" fill="#1B3548" font-size="29" font-weight="700">Five participants × ten rounds</text><text x="990" y="1030" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Distinct sessions · common prior-round context</text><rect x="730" y="1054" width="100" height="40" rx="8" fill="white" stroke="#BFCFD7" stroke-width="1.5"/><text x="780" y="1081" text-anchor="middle" fill="#1B3548" font-size="18" font-weight="700">Agent 1</text><rect x="835" y="1054" width="100" height="40" rx="8" fill="white" stroke="#BFCFD7" stroke-width="1.5"/><text x="885" y="1081" text-anchor="middle" fill="#1B3548" font-size="18" font-weight="700">Agent 2</text><rect x="940" y="1054" width="100" height="40" rx="8" fill="white" stroke="#BFCFD7" stroke-width="1.5"/><text x="990" y="1081" text-anchor="middle" fill="#1B3548" font-size="18" font-weight="700">Agent 3</text><rect x="1045" y="1054" width="100" height="40" rx="8" fill="white" stroke="#BFCFD7" stroke-width="1.5"/><text x="1095" y="1081" text-anchor="middle" fill="#1B3548" font-size="18" font-weight="700">Agent 4</text><rect x="1150" y="1054" width="100" height="40" rx="8" fill="white" stroke="#BFCFD7" stroke-width="1.5"/><text x="1200" y="1081" text-anchor="middle" fill="#1B3548" font-size="18" font-weight="700">Agent 5</text><text x="990" y="1122" text-anchor="middle" fill="#526977" font-size="19" font-weight="400">All five contributions before advancing a round</text><rect x="1460" y="953" width="460" height="190" rx="14" fill="#F4F8FA" stroke="#BFCFD7" stroke-width="2"/><text x="1690.0" y="995" text-anchor="middle" fill="#1B3548" font-size="28" font-weight="700">Next direction</text><text x="1690.0" y="1031" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Coordinator synthesis · next steps</text><text x="1690.0" y="1059" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Dissent · rejected approaches</text><text x="1690.0" y="1087" text-anchor="middle" fill="#526977" font-size="20" font-weight="400">Open obligations · stopping conditions</text><path d="M 559,1047 L 671,1047" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="581.5" y="1005" width="67.0" height="23" fill="white"/><text x="615" y="1021" text-anchor="middle" fill="#526977" font-size="17" font-weight="400">sealed</text><rect x="571.0" y="1024" width="88.0" height="23" fill="white"/><text x="615" y="1040" text-anchor="middle" fill="#526977" font-size="17" font-weight="400">summary</text><path d="M 1309,1047 L 1451,1047" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1302.5" y="1016" width="155.0" height="23" fill="white"/><text x="1380" y="1032" text-anchor="middle" fill="#526977" font-size="17" font-weight="400">50 accepted posts</text><path d="M 660,295 L 660,302 L 42,302 L 42,1047 L 71,1047" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1929,1047 L 1992,1047 L 1992,326 L 1080,326 L 1080,295" fill="none" stroke="#237F8B" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1389.0" y="298" width="302.0" height="24" fill="white"/><text x="1540" y="315" text-anchor="middle" fill="#526977" font-size="18" font-weight="400">continue with the recorded direction</text><path d="M1952,326 L1968,326" fill="none" stroke="white" stroke-width="10"/><path d="M1952,326 L1968,326" fill="none" stroke="#237F8B" stroke-width="2.7"/><text x="80" y="1201" text-anchor="start" fill="#526977" font-size="19" font-weight="400">No fixed retry-count cap. Continued operation depends on the account, machine, and available resources.</text><text x="80" y="1235" text-anchor="start" fill="#526977" font-size="19" font-weight="400">Independent model verification and discussion consensus are not formal proof certificates.</text><text x="80" y="1269" text-anchor="start" fill="#526977" font-size="18" font-weight="400">Acceptance pending: a full real-model 5 × 10 discussion and an installed OS-service restart.</text><text x="1920" y="1269" text-anchor="end" fill="#237F8B" font-size="20" font-weight="700">TANGO</text></g></svg>